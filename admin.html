<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="admin.webmanifest"><meta name="theme-color" content="#1f6b52">
<title>Admin · Despensa de Casa</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: panel de una columna ancha; tarjetas de números arriba, después gráficos y tablas */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#16201c; --muted:#5a6a63; --line:#dbe3df;
  --accent:#1f6b52; --accent-ink:#ffffff; --accent-soft:#dcefe6; --bad:#b42318; --bad-bg:#fde6e3; --warn:#9a5b00; --warn-bg:#fff1d6;
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1412; --surface:#17201c; --ink:#e5ece8; --muted:#93a39c; --line:#28342f; --accent:#52c194; --accent-ink:#06120d; --accent-soft:#183a2d; --bad:#ff8d7d; --bad-bg:#3b1915; --warn:#f1b44a; --warn-bg:#35280f; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px 16px}
h1{font:800 1.6rem/1.1 var(--f-display);margin:0}
h2{font:700 .78rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px}
.sub{color:var(--muted);font-size:.88rem}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px}
.kpi small{color:var(--muted);font-weight:700;font-size:.78rem}
.kpi b{font:800 2rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
/* barras de altas por día */
.bars{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);padding-top:16px;position:relative}
.bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bar:hover i,.bar:focus i{background:var(--ink)}
.bar .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.75rem;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.bar:hover .tip,.bar:focus .tip{opacity:1}
.bar .tip{visibility:hidden}.bar:hover .tip,.bar:focus .tip{visibility:visible}
.bar:nth-last-child(-n+8) .tip{left:auto;right:0;transform:none}
.bar:nth-child(-n+8) .tip{left:0;transform:none}
.ejes{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:4px}
/* barras horizontales */
.hb{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88rem;padding-block:3px}
.hb > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
/* tabla */
.tabla{overflow-x:auto;max-width:100%}
.grid2 > div{min-width:0}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:.78rem;cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
tr:hover td{background:var(--bg)}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft)}
.pill.no{background:var(--warn-bg);color:var(--warn)}
input.buscar{width:100%;max-width:280px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.gate{min-height:80vh;display:grid;place-items:center}
.gate .panel{max-width:380px;display:grid;gap:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700}
.cargando{padding:40px;text-align:center;color:var(--muted)}
.nota{font-size:.82rem;color:var(--muted);margin-top:8px}
/* pestañas y publicidad */
.pest{display:flex;gap:6px;margin:4px 0 8px;border-bottom:1px solid var(--line)}
.pest-b{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.pest-b[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.espacios{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.esp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.esp b{font-size:.95rem}.esp span{font-size:.82rem;color:var(--muted)}
.esp em{font-style:normal;font-weight:700;font-size:.78rem;color:var(--accent)}
.form{display:grid;gap:12px}
.form .f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.campo{display:grid;gap:4px;min-width:0}
.campo > span{font-size:.8rem;font-weight:700;color:var(--muted)}
.campo input:not([type=checkbox]),.campo textarea,.campo select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.campo textarea{min-height:64px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--accent);width:auto;margin:0}
.campo input[type=color]{height:42px;padding:4px}
.prev{background:#f2f3ec;border-radius:16px;padding:14px;display:grid;gap:10px}
.prev .card{display:flex;gap:12px;align-items:center;background:#fdfdf9;border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px #e1e3d6;color:#23271d;position:relative}
.prev .card img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.prev .card.solo{padding:0;overflow:hidden;display:block}.prev .card.solo img{width:100%;height:auto;max-height:180px;border-radius:0;display:block}
.prev .card b{display:block;font-size:1.02rem}.prev .card small{color:inherit;opacity:.75}
.prev .cta{margin-left:auto;background:#56632f;color:#fbfcf6;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem;white-space:nowrap}
.prev .tag{position:absolute;top:5px;right:10px;font-size:.66rem;color:inherit;opacity:.7}
.prev .card[style] .cta{background:#fff;color:#23271d}
.mini{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--bg);vertical-align:middle}
.estado{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px}
.estado.on{background:var(--accent-soft)}.estado.off{background:var(--bg);color:var(--muted)}.estado.ven{background:var(--bad-bg);color:var(--bad)}.estado.prog{background:var(--warn-bg);color:var(--warn)}
.lnk{white-space:nowrap;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 6px}
.lnk.mal{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <section class="gate" id="gate" hidden>
    <div class="panel">
      <h1>Administración</h1>
      <p class="sub" style="margin:0">Despensa de Casa · estadísticas y publicidad</p>
      <form id="fLogin" class="form" autocomplete="on">
        <label class="campo"><span>Usuario</span><input id="lUser" autocomplete="username" required></label>
        <label class="campo"><span>Contraseña</span><input id="lPass" type="password" autocomplete="current-password" required></label>
        <button class="btn" id="btnLogin">Entrar</button>
      </form>
      <div class="err" id="gateErr" hidden></div>
    </div>
  </section>

  <div id="panel" hidden>
    <header>
      <div><h1>Administración</h1><div class="sub" id="actualizado"></div></div>
      <div class="acc">
        <button class="btn ghost" id="btnCsv">Descargar barrios (CSV)</button>
        <button class="btn" id="btnRecargar">Actualizar</button>
        <button class="btn ghost" id="btnClave">Cambiar contraseña</button>
        <button class="btn ghost" id="btnSalir">Salir</button>
      </div>
    </header>
    <nav class="pest" role="tablist">
      <button class="pest-b" data-pest="stats" aria-selected="true">Estadísticas</button>
      <button class="pest-b" data-pest="pub" aria-selected="false">Publicidad</button>
    </nav>
    <div id="reglasBox" hidden></div>
    <div id="clave" hidden></div>
    <div id="contenido"><div class="cargando">Cargando estadísticas…</div></div>
    <div id="publicidad" hidden></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyDg0svGUiA37wOkrs31ROHMfx-OieBG6Xo",
  authDomain: "casa-48f64.firebaseapp.com",
  projectId: "casa-48f64",
  storageBucket: "casa-48f64.firebasestorage.app",
  messagingSenderId: "839069249046",
  appId: "1:839069249046:web:a76ce8e1b2c6e15b920f37"
}, "administracion");
const auth = getAuth(app);
// ninguna consulta puede quedar cargando para siempre
const conTiempo = (p, ms = 25000) => Promise.race([p, new Promise((_, mal) => setTimeout(() => mal(Object.assign(new Error("Firebase tardó demasiado en responder"), { code: "unavailable" })), ms))]);
const $ = s => document.querySelector(s);
// ---- lectura directa de Firestore por su API web (pedidos comunes, sin conexión permanente) ----
const PROYECTO = "casa-48f64";
const BASE_DATOS = "default";   // nombre de la base de Firestore de este proyecto
const BASE = `https://firestore.googleapis.com/v1/projects/${PROYECTO}/databases/${BASE_DATOS}/documents`;
async function rest(path, opts = {}) {
  const tok = await auth.currentUser.getIdToken();
  let r;
  try { r = await conTiempo(fetch(BASE + path, { ...opts, headers: { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" } }), 30000); }
  catch (e) { throw Object.assign(new Error(e?.message || "sin respuesta"), { code: "unavailable", http: 0 }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error((Array.isArray(j) ? j[0] : j)?.error?.message || r.statusText), { code: (Array.isArray(j) ? j[0] : j)?.error?.status || String(r.status), http: r.status });
  return j;
}
const val = v => v == null ? null : "stringValue" in v ? v.stringValue : "integerValue" in v ? +v.integerValue : "doubleValue" in v ? v.doubleValue
  : "booleanValue" in v ? v.booleanValue : "timestampValue" in v ? { toMillis: () => Date.parse(v.timestampValue) }
  : "mapValue" in v ? obj(v.mapValue.fields || {}) : "arrayValue" in v ? (v.arrayValue.values || []).map(val) : null;
const obj = f => Object.fromEntries(Object.entries(f || {}).map(([k, v]) => [k, val(v)]));
async function listar(col) {
  const out = []; let tok = "";
  do {
    const j = await rest(`/${col}?pageSize=300${tok ? `&pageToken=${encodeURIComponent(tok)}` : ""}`);
    for (const d of j.documents || []) out.push({ id: d.name.split("/").pop(), ...obj(d.fields) });
    tok = j.nextPageToken || "";
  } while (tok);
  return out;
}
async function agregar(coleccion, aggregations) {
  const j = await rest(":runAggregationQuery", { method: "POST", body: JSON.stringify({ structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: coleccion, allDescendants: true }] }, aggregations } }) });
  return obj(j[0]?.result?.aggregateFields);
}
async function topProductos() {
  const j = await rest(":runQuery", { method: "POST", body: JSON.stringify({ structuredQuery: { from: [{ collectionId: "productos" }], orderBy: [{ field: { fieldPath: "usos" }, direction: "DESCENDING" }], limit: 15 } }) });
  return j.filter(x => x.document).map(x => obj(x.document.fields));
}
// ¿esta cuenta puede leer? (404 = puede, el documento simplemente no existe)
async function probarAcceso() {
  try { await rest("/admin/acceso"); }
  catch (e) { if (!(e.http === 404 && !/does not exist/i.test(e.message))) throw e; }
  // y que pueda listar usuarios (lo que necesitan las estadísticas)
  try { await rest("/usuarios?pageSize=1"); }
  catch (e) { e.message = "Firebase deja entrar pero no listar usuarios: " + e.message + ". Falta publicar las reglas nuevas (con «allow list: if esAdmin();» en usuarios)."; throw e; }
}
const normal = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ms = t => t?.toMillis ? t.toMillis() : typeof t === "number" ? t : 0;
const DIA = 86400000;
const n0 = n => (n || 0).toLocaleString("es-AR");
const pesos = n => (+n || 0).toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
const MIN_CASAS_COMERCIO = 20;   // casas por barrio para mostrar datos a comercios sin identificar a nadie

// ---- ingreso con usuario y contraseña ----
const USUARIO = "uriel bacher";
const ADMIN_MAIL = "admin@despensa-casa.app";          // cuenta interna de Firebase para esta app
const claveFb = p => "Despensa#" + p + "#admin";       // Firebase pide 6+ caracteres: se completa sola
const errGate = t => { $("#gateErr").innerHTML = t; $("#gateErr").hidden = false; };
$("#fLogin").onsubmit = async ev => {
  ev.preventDefault(); $("#gateErr").hidden = true;
  const us = normal($("#lUser").value), p = $("#lPass").value;
  if (us !== USUARIO) return errGate("Usuario o contraseña incorrectos.");
  const b = $("#btnLogin"); b.disabled = true; b.textContent = "Entrando…";
  try {
    try { await signInWithEmailAndPassword(auth, ADMIN_MAIL, claveFb(p)); }
    catch (e) {
      if (!/invalid-credential|user-not-found|wrong-password|invalid-login/.test(e.code) || p !== "1234") throw e;
      // primera vez: se crea la cuenta de administración con la contraseña inicial
      try { await createUserWithEmailAndPassword(auth, ADMIN_MAIL, claveFb(p)); }
      catch (e2) { throw e2.code === "auth/email-already-in-use" ? e : e2; }
    }
  } catch (e) {
    errGate(/invalid-credential|wrong-password|invalid-login/.test(e.code) ? "Usuario o contraseña incorrectos."
      : e.code === "auth/operation-not-allowed" ? "Firebase tiene apagado el ingreso con contraseña. Entrá a Firebase → Authentication → Método de acceso → <b>Correo electrónico/contraseña</b> → Habilitar → Guardar, y probá de nuevo."
      : e.code === "auth/too-many-requests" ? "Demasiados intentos. Esperá unos minutos."
      : e.code === "auth/network-request-failed" ? "Sin conexión. Revisá internet."
      : "No se pudo entrar: " + esc(e.code || e.message));
  }
  b.disabled = false; b.textContent = "Entrar";
};
// ---- cambiar contraseña ----
$("#btnClave").onclick = () => {
  const box = $("#clave"); if (!box.hidden) { box.hidden = true; return; }
  box.innerHTML = `<form class="panel form" id="fClave" style="margin:12px 0;max-width:420px">
    <b>Cambiar contraseña</b>
    <label class="campo"><span>Contraseña actual</span><input id="cAct" type="password" autocomplete="current-password" required></label>
    <label class="campo"><span>Contraseña nueva (mínimo 4)</span><input id="cNue" type="password" autocomplete="new-password" minlength="4" required></label>
    <label class="campo"><span>Repetila</span><input id="cRep" type="password" autocomplete="new-password" required></label>
    <div class="err" id="cErr" hidden></div>
    <div class="acc"><button class="btn">Guardar</button><button class="btn ghost" type="button" id="cCan">Cancelar</button></div></form>`;
  box.hidden = false;
  $("#cCan").onclick = () => box.hidden = true;
  $("#fClave").onsubmit = async ev => {
    ev.preventDefault();
    const err = t => { $("#cErr").textContent = t; $("#cErr").hidden = false; };
    if ($("#cNue").value.length < 4) return err("La nueva tiene que tener al menos 4 caracteres.");
    if ($("#cNue").value !== $("#cRep").value) return err("Las dos contraseñas nuevas no coinciden.");
    try {
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(ADMIN_MAIL, claveFb($("#cAct").value)));
      await updatePassword(auth.currentUser, claveFb($("#cNue").value));
      box.innerHTML = `<div class="panel" style="margin:12px 0">✓ Contraseña cambiada. La próxima vez entrá con la nueva.</div>`;
      setTimeout(() => box.hidden = true, 4000);
    } catch (e) { err(/invalid-credential|wrong-password/.test(e.code) ? "La contraseña actual no es correcta." : "No se pudo cambiar: " + (e.code || e.message)); }
  };
};
// ---- ¿están publicadas las reglas de esta versión? ----
const REGLAS_VERSION = "v6";
const REGLAS = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function logueado() { return request.auth != null; }\n    function casaPath(casa) { return /databases/$(database)/documents/hogar/$(casa); }\n    function esMiembro(casa) { return logueado() && exists(/databases/$(database)/documents/hogar/$(casa)/miembros/$(request.auth.uid)); }\n    function esCreador(casa) { return logueado() && get(casaPath(casa)).data.creador == request.auth.uid; }\n    function invitacionValida(casa, codigo) {\n      let inv = get(/databases/$(database)/documents/invitaciones/$(codigo)).data;\n      return inv.casa == casa && inv.expira > request.time;\n    }\n    // Administraci\u00f3n: la app /administracion (usuario Uriel Bacher) y tu cuenta de Google.\n    function esAdmin() { return request.auth != null && request.auth.token.email in ['admin@despensa-casa.app', 'uriel.bacher@gmail.com']; }\n    function texto(d, campo, max) { return !(campo in d) || (d[campo] is string && d[campo].size() <= max); }\n    function nuevo() { return request.resource.data; }\n\n    // Versi\u00f3n de estas reglas: la app de administraci\u00f3n la consulta para saber si est\u00e1n publicadas.\n    match /reglas/{version} { allow get: if version == 'v6'; }\n    match /admin/{doc} { allow read: if esAdmin(); }\n\n    match /usuarios/{uid} {\n      allow list: if esAdmin();\n      allow get: if esAdmin() || (logueado() && request.auth.uid == uid);\n      allow delete: if logueado() && request.auth.uid == uid;\n      allow create, update: if logueado() && request.auth.uid == uid\n        && texto(nuevo(), 'nombre', 60) && texto(nuevo(), 'apellido', 60)\n        && texto(nuevo(), 'provincia', 60) && texto(nuevo(), 'barrio', 80)\n        && (!('dni' in nuevo()) || nuevo().dni.matches('^[0-9]{7,8}$'));\n    }\n\n    match /dnis/{hash} {\n      allow create: if logueado() && nuevo().uid == request.auth.uid && nuevo().keys().hasOnly(['uid', 'ts']);\n      allow update: if logueado() && resource.data.uid == request.auth.uid && nuevo().uid == request.auth.uid;\n      allow delete: if logueado() && resource.data.uid == request.auth.uid;\n    }\n\n    match /anuncios/{id} {\n      allow read: if logueado();\n      allow create, update, delete: if esAdmin();\n      allow update: if logueado() && nuevo().diff(resource.data).affectedKeys().hasOnly(['vistas']) && nuevo().vistas == resource.data.get('vistas', 0) + 1;\n      allow update: if logueado() && nuevo().diff(resource.data).affectedKeys().hasOnly(['clicks']) && nuevo().clicks == resource.data.get('clicks', 0) + 1;\n    }\n\n    match /productos/{clave} {\n      allow read: if logueado();\n      allow create: if logueado() && nuevo().keys().hasOnly(['nombre', 'norm', 'claves', 'categoria', 'unidad', 'usos', 'por', 'ts'])\n        && nuevo().nombre is string && nuevo().nombre.size() > 0 && nuevo().nombre.size() <= 120\n        && nuevo().claves is list && nuevo().claves.size() <= 60 && nuevo().usos == 1 && nuevo().por == request.auth.uid;\n      allow update: if logueado() && nuevo().diff(resource.data).affectedKeys().hasOnly(['usos', 'ts']) && nuevo().usos == resource.data.usos + 1;\n    }\n\n    match /catalogo/{codigo} {\n      allow get: if logueado();\n      allow create, update: if logueado() && nuevo().nombre is string && nuevo().nombre.size() > 0 && nuevo().nombre.size() <= 120\n        && nuevo().por == request.auth.uid && nuevo().keys().hasOnly(['nombre', 'categoria', 'unidad', 'por', 'ts']);\n    }\n\n    match /invitaciones/{codigo} {\n      allow get: if logueado();\n      allow create: if esMiembro(nuevo().casa) && nuevo().por == request.auth.uid;\n      allow update: if esMiembro(resource.data.casa) && nuevo().casa == resource.data.casa;\n      allow delete: if resource == null || esMiembro(resource.data.casa);\n    }\n\n    match /{ruta=**}/items/{id} { allow read: if esAdmin(); }\n    match /{ruta=**}/compras/{id} { allow read: if esAdmin(); }\n\n    match /hogar/{casa} {\n      allow list: if esAdmin();\n      allow get: if esAdmin() || esMiembro(casa);\n      allow create: if logueado() && nuevo().creador == request.auth.uid;\n      allow update: if esMiembro(casa) && nuevo().creador == resource.data.creador;\n      allow delete: if esCreador(casa);\n      match /miembros/{uid} {\n        allow read: if esMiembro(casa);\n        allow create: if logueado() && uid == request.auth.uid && (getAfter(casaPath(casa)).data.creador == request.auth.uid\n          || (nuevo().codigo is string && invitacionValida(casa, nuevo().codigo)));\n        allow update: if logueado() && uid == request.auth.uid;\n        allow delete: if logueado() && (uid == request.auth.uid || esCreador(casa));\n      }\n      match /{coleccion}/{documento=**} {\n        allow read, write: if coleccion != 'miembros' && esMiembro(casa);\n      }\n    }\n  }\n}\n";

// achica la imagen para que entre en la base (máx. ~900 px, JPEG)
async function achicarImagen(file) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  let q = .82, url = c.toDataURL("image/jpeg", q);
  while (url.length > 450000 && q > .4) { q -= .1; url = c.toDataURL("image/jpeg", q); }
  return url;
}

$("#btnRecargar").addEventListener("click", () => { if (!$("#publicidad").hidden) cargarPublicidad(); });

let datos = null, ordenBarrios = { col: "usuarios", desc: true }, filtroBarrio = "";

async function intentar(fn, def) { try { return await conTiempo(fn()); } catch (e) { console.warn(e); return def; } }

async function cargar() {
  $("#contenido").innerHTML = `<div class="cargando">Cargando estadísticas…</div>`;
  let us, casas, nItems, compras, top; const faltan = [];
  try {
    [us, casas, nItems, compras, top] = await Promise.all([
      listar("usuarios").catch(e => { e.coleccion = "usuarios"; throw e; }),
      listar("hogar").catch(e => { if (e.http === 403) { faltan.push("casas"); return []; } throw e; }),
      intentar(async () => (await agregar("items", [{ alias: "n", count: {} }])).n, null),
      intentar(async () => { const r = await agregar("compras", [{ alias: "n", count: {} }, { alias: "total", sum: { field: { fieldPath: "total" } } }]); return { n: r.n, total: r.total }; }, null),
      intentar(() => topProductos(), []),
    ]);
  } catch (e) {
    const msg = e?.http === 403 ? "Firebase no deja leer «" + (e.coleccion || "datos") + "» (" + e.message + ").<br>Las reglas que están activas en Firebase no son las nuevas: en Firestore → Reglas tiene que figurar <b>esAdmin()</b> dentro de <b>match /usuarios</b>, y al tocar Publicar no tiene que salir ningún cartel rojo." : e?.code === "unavailable" ? "Firebase no respondió a tiempo." : "No se pudieron leer los datos: " + (e?.message || e);
    $("#contenido").innerHTML = `<div class="cargando">${msg}<br><br><button class="btn" id="btnReintentar">Reintentar</button></div>`;
    $("#btnReintentar").onclick = () => cargar();
    return;
  }
  datos = {
    usuarios: us,
    casas: casas,
    nItems, compras, top, cuando: new Date(), faltan,
  };
  pintar();
}

function calcular() {
  const ahora = Date.now();
  const U = datos.usuarios, C = datos.casas;
  const completos = U.filter(u => u.dni && u.barrio);
  const activos = d => U.filter(u => ms(u.visto) > ahora - d * DIA).length;
  const nuevos = d => U.filter(u => ms(u.creado) > ahora - d * DIA).length;
  // altas por día, últimos 30 días
  const dias = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(ahora - i * DIA); d.setHours(0, 0, 0, 0); dias.push({ d, n: 0 }); }
  for (const u of U) { const t = ms(u.creado); if (!t) continue; const i = Math.floor((t - dias[0].d.getTime()) / DIA); if (i >= 0 && i < 30) dias[i].n++; }
  // por barrio
  const mapa = new Map();
  const clave = (p, b) => `${p || "Sin provincia"}|${b || "Sin barrio"}`;
  for (const u of completos) {
    const k = clave(u.provincia, u.barrio);
    const x = mapa.get(k) || { provincia: u.provincia, barrio: u.barrio, usuarios: 0, activos: 0, casas: 0 };
    x.usuarios++; if (ms(u.visto) > ahora - 30 * DIA) x.activos++;
    mapa.set(k, x);
  }
  for (const c of C) {
    if (!c.barrio) continue;
    const k = clave(c.provincia, c.barrio);
    const x = mapa.get(k) || { provincia: c.provincia, barrio: c.barrio, usuarios: 0, activos: 0, casas: 0 };
    x.casas++; mapa.set(k, x);
  }
  const barrios = [...mapa.values()];
  const provincias = new Map();
  for (const b of barrios) provincias.set(b.provincia || "Sin provincia", (provincias.get(b.provincia || "Sin provincia") || 0) + b.usuarios);
  // plataformas
  const plat = { android: 0, ios: 0, compu: 0, otro: 0 };
  for (const u of U) plat[u.plataforma in plat ? u.plataforma : "otro"]++;
  const instaladas = U.filter(u => u.instalada).length;
  // boca a boca
  const refs = new Map();
  for (const u of U) if (u.referidoPor) refs.set(u.referidoPor, (refs.get(u.referidoPor) || 0) + 1);
  const quien = r => { const u = U.find(x => x.id.slice(0, 12) === r); return u ? `${u.nombre || ""} ${u.apellido || ""}`.trim() || "(sin nombre)" : `código ${r}`; };
  const topRefs = [...refs].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([r, n]) => ({ nombre: quien(r), n }));
  const referidos = U.filter(u => u.referidoPor).length;
  // casas con más de una persona
  const porCasa = new Map(); for (const u of U) if (u.casa) porCasa.set(u.casa, (porCasa.get(u.casa) || 0) + 1);
  const compartidas = [...porCasa.values()].filter(n => n > 1).length;
  return { U, C, completos, activos, nuevos, dias, barrios, provincias, plat, instaladas, topRefs, referidos, compartidas };
}

function pintar() {
  const k = calcular();
  $("#actualizado").textContent = `Datos al ${datos.cuando.toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
  const maxDia = Math.max(1, ...k.dias.map(d => d.n));
  const totalDias = k.dias.reduce((s, d) => s + d.n, 0);
  const provs = [...k.provincias].sort((a, b) => b[1] - a[1]);
  const maxProv = Math.max(1, ...provs.map(p => p[1]));
  const platNom = { android: "Android", ios: "iPhone", compu: "Computadora", otro: "Sin dato todavía" };
  const plats = Object.entries(k.plat).filter(([, n]) => n);
  const maxPlat = Math.max(1, ...plats.map(p => p[1]));
  const barriosListos = k.barrios.filter(b => b.casas >= MIN_CASAS_COMERCIO).length;

  $("#contenido").innerHTML = (datos.faltan?.length ? `<div class="err" style="margin:10px 0">Firebase no deja leer: ${datos.faltan.join(", ")}. Revisá que estén publicadas las reglas nuevas.</div>` : "") + `
    <div class="kpis">
      <div class="kpi"><small>Usuarios registrados</small><b>${n0(k.U.length)}</b><span>${n0(k.completos.length)} con datos completos</span></div>
      <div class="kpi"><small>Casas</small><b>${n0(k.C.length)}</b><span>${n0(k.compartidas)} con más de una persona</span></div>
      <div class="kpi"><small>Activos 7 días</small><b>${n0(k.activos(7))}</b><span>${pct(k.activos(7), k.U.length)} de los usuarios</span></div>
      <div class="kpi"><small>Activos 30 días</small><b>${n0(k.activos(30))}</b><span>${pct(k.activos(30), k.U.length)} de los usuarios</span></div>
      <div class="kpi"><small>Nuevos esta semana</small><b>${n0(k.nuevos(7))}</b><span>${n0(k.nuevos(30))} en 30 días</span></div>
      <div class="kpi"><small>Vinieron recomendados</small><b>${n0(k.referidos)}</b><span>${pct(k.referidos, k.U.length)} de las altas</span></div>
      <div class="kpi"><small>App instalada</small><b>${pct(k.instaladas, k.U.length)}</b><span>${n0(k.instaladas)} usuarios</span></div>
      <div class="kpi"><small>Productos cargados</small><b>${datos.nItems == null ? "—" : n0(datos.nItems)}</b><span>en todas las despensas</span></div>
      <div class="kpi"><small>Compras registradas</small><b>${datos.compras ? n0(datos.compras.n) : "—"}</b><span>${datos.compras ? pesos(datos.compras.total) + " en total" : "sin acceso todavía"}</span></div>
    </div>

    <h2>Altas por día · últimos 30 días</h2>
    <div class="panel">
      <div class="bars" role="img" aria-label="Altas por día: ${totalDias} en 30 días">${k.dias.map(d => `
        <div class="bar" tabindex="0"><i style="height:${d.n / maxDia * 100}%"></i><span class="tip">${d.d.toLocaleDateString("es-AR", { day: "numeric", month: "short" })}: ${d.n} alta${d.n === 1 ? "" : "s"}</span></div>`).join("")}</div>
      <div class="ejes"><span>${k.dias[0].d.toLocaleDateString("es-AR", { day: "numeric", month: "short" })}</span><span>Máximo: ${maxDia} por día · total ${totalDias}</span><span>hoy</span></div>
    </div>

    <div class="grid2">
      <div><h2>Usuarios por provincia</h2><div class="panel">${provs.length ? provs.map(([p, n]) => `<div class="hb"><span title="${esc(p)}">${esc(p)}</span><span class="track"><i style="width:${n / maxProv * 100}%"></i></span><b>${n}</b></div>`).join("") : `<p class="sub">Todavía no hay datos.</p>`}</div></div>
      <div><h2>Desde dónde la usan</h2><div class="panel">${plats.map(([p, n]) => `<div class="hb"><span>${platNom[p]}</span><span class="track"><i style="width:${n / maxPlat * 100}%"></i></span><b>${n}</b></div>`).join("") || `<p class="sub">Todavía no hay datos.</p>`}
        <p class="nota">Se registra cuando cada persona abre la app con esta versión.</p></div></div>
    </div>

    <h2>Barrios</h2>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <input class="buscar" id="buscarBarrio" placeholder="Buscar barrio o provincia" value="${esc(filtroBarrio)}">
        <span class="sub">${barriosListos} barrio${barriosListos === 1 ? "" : "s"} con ${MIN_CASAS_COMERCIO}+ casas (listos para mostrar datos a comercios)</span>
      </div>
      <div class="tabla"><table>
        <thead><tr>${[["barrio", "Barrio", ""], ["provincia", "Provincia", ""], ["usuarios", "Usuarios", "n"], ["activos", "Activos 30 d", "n"], ["casas", "Casas", "n"], ["listo", "Comercios", ""]].map(([c, t, cl]) => `<th class="${cl}" data-orden="${c}">${t}${ordenBarrios.col === c ? (ordenBarrios.desc ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
        <tbody id="tbBarrios"></tbody>
      </table></div>
    </div>

    <div class="grid2">
      <div><h2>Los que más recomiendan</h2><div class="panel">${k.topRefs.length ? `<div class="tabla"><table><tbody>${k.topRefs.map((r, i) => `<tr><td>${i + 1}. ${esc(r.nombre)}</td><td class="n">${r.n} persona${r.n === 1 ? "" : "s"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="sub">Cuando alguien entre con un link de "Recomendá Despensa", aparece acá.</p>`}</div></div>
      <div><h2>Productos más cargados</h2><div class="panel">${datos.top.length ? `<div class="tabla"><table><tbody>${datos.top.map(p => `<tr><td>${esc(p.nombre)}</td><td>${esc(p.categoria || "")}</td><td class="n">${p.usos} casa${p.usos === 1 ? "" : "s"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="sub">Todavía no hay productos en el catálogo.</p>`}</div></div>
    </div>
    <p class="nota">Los datos personales (DNI, mail) no se muestran en este panel. Los números se calculan al abrirlo; tocá Actualizar para refrescar.</p>`;
  pintarBarrios(k);
  $("#buscarBarrio").oninput = e => { filtroBarrio = e.target.value; pintarBarrios(calcular()); };
  for (const th of document.querySelectorAll("[data-orden]")) th.onclick = () => {
    const c = th.dataset.orden;
    ordenBarrios = { col: c, desc: ordenBarrios.col === c ? !ordenBarrios.desc : !["barrio", "provincia"].includes(c) };
    pintar();
  };
}

function pintarBarrios(k) {
  const q = filtroBarrio.trim().toLowerCase();
  const filas = k.barrios.filter(b => !q || `${b.barrio} ${b.provincia}`.toLowerCase().includes(q)).map(b => ({ ...b, listo: b.casas >= MIN_CASAS_COMERCIO ? 1 : 0 }));
  const { col, desc } = ordenBarrios;
  filas.sort((a, b) => { const x = a[col] ?? "", y = b[col] ?? ""; const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "es"); return desc ? -r : r; });
  $("#tbBarrios").innerHTML = filas.length ? filas.map(b => `<tr><td>${esc(b.barrio)}</td><td>${esc(b.provincia)}</td><td class="n">${b.usuarios}</td><td class="n">${b.activos}</td><td class="n">${b.casas}</td>
    <td>${b.listo ? `<span class="pill">Listo</span>` : `<span class="pill no">Faltan ${MIN_CASAS_COMERCIO - b.casas}</span>`}</td></tr>`).join("")
    : `<tr><td colspan="6" class="sub">Sin resultados.</td></tr>`;
}

$("#btnCsv").onclick = () => {
  if (!datos) return;
  const k = calcular();
  const filas = [["Provincia", "Barrio", "Usuarios", "Activos 30 dias", "Casas"], ...k.barrios.map(b => [b.provincia, b.barrio, b.usuarios, b.activos, b.casas])];
  const csv = "﻿" + filas.map(f => f.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `despensa-barrios-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
</script>
