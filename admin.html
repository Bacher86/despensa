<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel de Despensa</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: panel de una columna ancha; tarjetas de números arriba, después gráficos y tablas */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#16201c; --muted:#5a6a63; --line:#dbe3df;
  --accent:#1f6b52; --accent-ink:#ffffff; --accent-soft:#dcefe6; --bad:#b42318; --bad-bg:#fde6e3; --warn:#9a5b00; --warn-bg:#fff1d6;
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1412; --surface:#17201c; --ink:#e5ece8; --muted:#93a39c; --line:#28342f; --accent:#52c194; --accent-ink:#06120d; --accent-soft:#183a2d; --bad:#ff8d7d; --bad-bg:#3b1915; --warn:#f1b44a; --warn-bg:#35280f; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px 16px}
h1{font:800 1.6rem/1.1 var(--f-display);margin:0}
h2{font:700 .78rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px}
.sub{color:var(--muted);font-size:.88rem}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:2px}
.kpi small{color:var(--muted);font-weight:700;font-size:.78rem}
.kpi b{font:800 2rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
/* barras de altas por día */
.bars{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);padding-top:16px;position:relative}
.bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative}
.bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.bar:hover i,.bar:focus i{background:var(--ink)}
.bar .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.75rem;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;z-index:2}
.bar:hover .tip,.bar:focus .tip{opacity:1}
.bar .tip{visibility:hidden}.bar:hover .tip,.bar:focus .tip{visibility:visible}
.bar:nth-last-child(-n+8) .tip{left:auto;right:0;transform:none}
.bar:nth-child(-n+8) .tip{left:0;transform:none}
.ejes{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:4px}
/* barras horizontales */
.hb{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88rem;padding-block:3px}
.hb > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
/* tabla */
.tabla{overflow-x:auto;max-width:100%}
.grid2 > div{min-width:0}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:.78rem;cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
tr:hover td{background:var(--bg)}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft)}
.pill.no{background:var(--warn-bg);color:var(--warn)}
input.buscar{width:100%;max-width:280px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.gate{min-height:80vh;display:grid;place-items:center}
.gate .panel{max-width:380px;display:grid;gap:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700}
.cargando{padding:40px;text-align:center;color:var(--muted)}
.nota{font-size:.82rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <section class="gate" id="gate" hidden>
    <div class="panel">
      <h1>Panel de Despensa</h1>
      <p class="sub" style="margin:0">Estadísticas de uso. Solo para administradores.</p>
      <button class="btn" id="btnLogin">Entrar con Google</button>
      <div class="err" id="gateErr" hidden></div>
    </div>
  </section>

  <div id="panel" hidden>
    <header>
      <div><h1>Panel de Despensa</h1><div class="sub" id="actualizado"></div></div>
      <div class="acc">
        <button class="btn ghost" id="btnCsv">Descargar barrios (CSV)</button>
        <button class="btn" id="btnRecargar">Actualizar</button>
        <button class="btn ghost" id="btnSalir">Salir</button>
      </div>
    </header>
    <div id="contenido"><div class="cargando">Cargando estadísticas…</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyDg0svGUiA37wOkrs31ROHMfx-OieBG6Xo",
  authDomain: "casa-48f64.firebaseapp.com",
  projectId: "casa-48f64",
  storageBucket: "casa-48f64.firebasestorage.app",
  messagingSenderId: "839069249046",
  appId: "1:839069249046:web:a76ce8e1b2c6e15b920f37"
});
const auth = getAuth(app);
// ninguna consulta puede quedar cargando para siempre
const conTiempo = (p, ms = 25000) => Promise.race([p, new Promise((_, mal) => setTimeout(() => mal(Object.assign(new Error("Firebase tardó demasiado en responder"), { code: "unavailable" })), ms))]);
const $ = s => document.querySelector(s);
// ---- lectura directa de Firestore por su API web (pedidos comunes, sin conexión permanente) ----
const PROYECTO = "casa-48f64";
const BASE = `https://firestore.googleapis.com/v1/projects/${PROYECTO}/databases/(default)/documents`;
async function rest(path, opts = {}) {
  const tok = await auth.currentUser.getIdToken();
  let r;
  try { r = await conTiempo(fetch(BASE + path, { ...opts, headers: { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" } }), 30000); }
  catch (e) { throw Object.assign(new Error(e?.message || "sin respuesta"), { code: "unavailable", http: 0 }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error((Array.isArray(j) ? j[0] : j)?.error?.message || r.statusText), { code: (Array.isArray(j) ? j[0] : j)?.error?.status || String(r.status), http: r.status });
  return j;
}
const val = v => v == null ? null : "stringValue" in v ? v.stringValue : "integerValue" in v ? +v.integerValue : "doubleValue" in v ? v.doubleValue
  : "booleanValue" in v ? v.booleanValue : "timestampValue" in v ? { toMillis: () => Date.parse(v.timestampValue) }
  : "mapValue" in v ? obj(v.mapValue.fields || {}) : "arrayValue" in v ? (v.arrayValue.values || []).map(val) : null;
const obj = f => Object.fromEntries(Object.entries(f || {}).map(([k, v]) => [k, val(v)]));
async function listar(col) {
  const out = []; let tok = "";
  do {
    const j = await rest(`/${col}?pageSize=300${tok ? `&pageToken=${encodeURIComponent(tok)}` : ""}`);
    for (const d of j.documents || []) out.push({ id: d.name.split("/").pop(), ...obj(d.fields) });
    tok = j.nextPageToken || "";
  } while (tok);
  return out;
}
async function agregar(coleccion, aggregations) {
  const j = await rest(":runAggregationQuery", { method: "POST", body: JSON.stringify({ structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: coleccion, allDescendants: true }] }, aggregations } }) });
  return obj(j[0]?.result?.aggregateFields);
}
async function topProductos() {
  const j = await rest(":runQuery", { method: "POST", body: JSON.stringify({ structuredQuery: { from: [{ collectionId: "productos" }], orderBy: [{ field: { fieldPath: "usos" }, direction: "DESCENDING" }], limit: 15 } }) });
  return j.filter(x => x.document).map(x => obj(x.document.fields));
}
// ¿esta cuenta puede leer? (404 = puede, el documento simplemente no existe)
async function probarAcceso() {
  try { await rest("/admin/acceso"); }
  catch (e) { if (e.http === 404 && !/database/i.test(e.message)) return; throw e; }
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ms = t => t?.toMillis ? t.toMillis() : typeof t === "number" ? t : 0;
const DIA = 86400000;
const n0 = n => (n || 0).toLocaleString("es-AR");
const pesos = n => (+n || 0).toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "—";
const MIN_CASAS_COMERCIO = 20;   // casas por barrio para mostrar datos a comercios sin identificar a nadie

$("#btnLogin").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") { $("#gateErr").textContent = "No se pudo entrar: " + e.message; $("#gateErr").hidden = false; } }
};
$("#btnSalir").onclick = () => signOut(auth);
$("#btnRecargar").onclick = () => cargar();

onAuthStateChanged(auth, async u => {
  $("#gate").hidden = !!u; $("#panel").hidden = !u;
  if (!u) return;
  // token nuevo: si el mail se verificó hace poco, el token viejo todavía dice "no verificado"
  let claims = {};
  try { claims = (await u.getIdTokenResult(true)).claims; } catch {}
  let e = null;
  for (let i = 0; i < 3; i++) {             // reintenta: la primera conexión a veces tarda
    try { await probarAcceso(); e = null; break; }
    catch (err) { e = err; if (err?.http && err.http !== 503) break; await new Promise(r => setTimeout(r, 1500)); }
  }
  if (e) {
    $("#panel").hidden = true; $("#gate").hidden = false;
    const code = e?.code || "", provs = u.providerData.map(p => p.providerId).join(", ") || "—";
    const motivo = e?.http === 403 && /app ?check/i.test(e.message) ? "Firebase pide App Check para la base de datos. En Firebase → App Check → APIs → Cloud Firestore, tocá «Dejar de aplicar» (Unenforce)."
      : e?.http === 404 ? "No se encontró la base de datos de Firestore en este proyecto. Revisá en Firebase → Firestore Database que exista la base «(default)»."
      : code === "PERMISSION_DENIED" || code === "permission-denied"
      ? `Firebase rechazó la cuenta ${u.email}: las reglas publicadas no la reconocen como administradora (o todavía no se publicaron).`
      : code === "unavailable" || /offline/i.test(e?.message || "")
        ? "No hay conexión con Firebase. Revisá internet y probá de nuevo."
        : `Error: ${code || e?.message}`;
    $("#gateErr").innerHTML = `${motivo}<br><br><small>Datos para revisar: mail <b>${u.email}</b> · verificado <b>${u.emailVerified ? "sí" : "no"}</b> (token: ${claims.email_verified ? "sí" : "no"}) · entra con <b>${provs}</b> · proyecto <b>${PROYECTO}</b> · código <b>${code || "—"}</b>${e?.http != null ? ` · HTTP <b>${e.http}</b>` : ""}<br>Mensaje de Google: <i>${String(e?.message || "").replace(/</g, "&lt;").slice(0, 220)}</i></small>`;
    $("#gateErr").hidden = false;
    return;
  }
  cargar();
});

let datos = null, ordenBarrios = { col: "usuarios", desc: true }, filtroBarrio = "";

async function intentar(fn, def) { try { return await conTiempo(fn()); } catch (e) { console.warn(e); return def; } }

async function cargar() {
  $("#contenido").innerHTML = `<div class="cargando">Cargando estadísticas…</div>`;
  let us, casas, nItems, compras, top;
  try {
    [us, casas, nItems, compras, top] = await Promise.all([
      listar("usuarios"),
      listar("hogar"),
      intentar(async () => (await agregar("items", [{ alias: "n", count: {} }])).n, null),
      intentar(async () => { const r = await agregar("compras", [{ alias: "n", count: {} }, { alias: "total", sum: { field: { fieldPath: "total" } } }]); return { n: r.n, total: r.total }; }, null),
      intentar(() => topProductos(), []),
    ]);
  } catch (e) {
    const msg = e?.http === 403 ? "Firebase no deja leer los usuarios (" + e.message + "). Revisá que las reglas nuevas estén publicadas." : e?.code === "unavailable" ? "Firebase no respondió a tiempo." : "No se pudieron leer los datos: " + (e?.message || e);
    $("#contenido").innerHTML = `<div class="cargando">${msg}<br><br><button class="btn" id="btnReintentar">Reintentar</button></div>`;
    $("#btnReintentar").onclick = () => cargar();
    return;
  }
  datos = {
    usuarios: us,
    casas: casas,
    nItems, compras, top, cuando: new Date(),
  };
  pintar();
}

function calcular() {
  const ahora = Date.now();
  const U = datos.usuarios, C = datos.casas;
  const completos = U.filter(u => u.dni && u.barrio);
  const activos = d => U.filter(u => ms(u.visto) > ahora - d * DIA).length;
  const nuevos = d => U.filter(u => ms(u.creado) > ahora - d * DIA).length;
  // altas por día, últimos 30 días
  const dias = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(ahora - i * DIA); d.setHours(0, 0, 0, 0); dias.push({ d, n: 0 }); }
  for (const u of U) { const t = ms(u.creado); if (!t) continue; const i = Math.floor((t - dias[0].d.getTime()) / DIA); if (i >= 0 && i < 30) dias[i].n++; }
  // por barrio
  const mapa = new Map();
  const clave = (p, b) => `${p || "Sin provincia"}|${b || "Sin barrio"}`;
  for (const u of completos) {
    const k = clave(u.provincia, u.barrio);
    const x = mapa.get(k) || { provincia: u.provincia, barrio: u.barrio, usuarios: 0, activos: 0, casas: 0 };
    x.usuarios++; if (ms(u.visto) > ahora - 30 * DIA) x.activos++;
    mapa.set(k, x);
  }
  for (const c of C) {
    if (!c.barrio) continue;
    const k = clave(c.provincia, c.barrio);
    const x = mapa.get(k) || { provincia: c.provincia, barrio: c.barrio, usuarios: 0, activos: 0, casas: 0 };
    x.casas++; mapa.set(k, x);
  }
  const barrios = [...mapa.values()];
  const provincias = new Map();
  for (const b of barrios) provincias.set(b.provincia || "Sin provincia", (provincias.get(b.provincia || "Sin provincia") || 0) + b.usuarios);
  // plataformas
  const plat = { android: 0, ios: 0, compu: 0, otro: 0 };
  for (const u of U) plat[u.plataforma in plat ? u.plataforma : "otro"]++;
  const instaladas = U.filter(u => u.instalada).length;
  // boca a boca
  const refs = new Map();
  for (const u of U) if (u.referidoPor) refs.set(u.referidoPor, (refs.get(u.referidoPor) || 0) + 1);
  const quien = r => { const u = U.find(x => x.id.slice(0, 12) === r); return u ? `${u.nombre || ""} ${u.apellido || ""}`.trim() || "(sin nombre)" : `código ${r}`; };
  const topRefs = [...refs].sort((a, b) => b[1] - a[1]).slice(0, 10).map(([r, n]) => ({ nombre: quien(r), n }));
  const referidos = U.filter(u => u.referidoPor).length;
  // casas con más de una persona
  const porCasa = new Map(); for (const u of U) if (u.casa) porCasa.set(u.casa, (porCasa.get(u.casa) || 0) + 1);
  const compartidas = [...porCasa.values()].filter(n => n > 1).length;
  return { U, C, completos, activos, nuevos, dias, barrios, provincias, plat, instaladas, topRefs, referidos, compartidas };
}

function pintar() {
  const k = calcular();
  $("#actualizado").textContent = `Datos al ${datos.cuando.toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
  const maxDia = Math.max(1, ...k.dias.map(d => d.n));
  const totalDias = k.dias.reduce((s, d) => s + d.n, 0);
  const provs = [...k.provincias].sort((a, b) => b[1] - a[1]);
  const maxProv = Math.max(1, ...provs.map(p => p[1]));
  const platNom = { android: "Android", ios: "iPhone", compu: "Computadora", otro: "Sin dato todavía" };
  const plats = Object.entries(k.plat).filter(([, n]) => n);
  const maxPlat = Math.max(1, ...plats.map(p => p[1]));
  const barriosListos = k.barrios.filter(b => b.casas >= MIN_CASAS_COMERCIO).length;

  $("#contenido").innerHTML = `
    <div class="kpis">
      <div class="kpi"><small>Usuarios registrados</small><b>${n0(k.U.length)}</b><span>${n0(k.completos.length)} con datos completos</span></div>
      <div class="kpi"><small>Casas</small><b>${n0(k.C.length)}</b><span>${n0(k.compartidas)} con más de una persona</span></div>
      <div class="kpi"><small>Activos 7 días</small><b>${n0(k.activos(7))}</b><span>${pct(k.activos(7), k.U.length)} de los usuarios</span></div>
      <div class="kpi"><small>Activos 30 días</small><b>${n0(k.activos(30))}</b><span>${pct(k.activos(30), k.U.length)} de los usuarios</span></div>
      <div class="kpi"><small>Nuevos esta semana</small><b>${n0(k.nuevos(7))}</b><span>${n0(k.nuevos(30))} en 30 días</span></div>
      <div class="kpi"><small>Vinieron recomendados</small><b>${n0(k.referidos)}</b><span>${pct(k.referidos, k.U.length)} de las altas</span></div>
      <div class="kpi"><small>App instalada</small><b>${pct(k.instaladas, k.U.length)}</b><span>${n0(k.instaladas)} usuarios</span></div>
      <div class="kpi"><small>Productos cargados</small><b>${datos.nItems == null ? "—" : n0(datos.nItems)}</b><span>en todas las despensas</span></div>
      <div class="kpi"><small>Compras registradas</small><b>${datos.compras ? n0(datos.compras.n) : "—"}</b><span>${datos.compras ? pesos(datos.compras.total) + " en total" : "sin acceso todavía"}</span></div>
    </div>

    <h2>Altas por día · últimos 30 días</h2>
    <div class="panel">
      <div class="bars" role="img" aria-label="Altas por día: ${totalDias} en 30 días">${k.dias.map(d => `
        <div class="bar" tabindex="0"><i style="height:${d.n / maxDia * 100}%"></i><span class="tip">${d.d.toLocaleDateString("es-AR", { day: "numeric", month: "short" })}: ${d.n} alta${d.n === 1 ? "" : "s"}</span></div>`).join("")}</div>
      <div class="ejes"><span>${k.dias[0].d.toLocaleDateString("es-AR", { day: "numeric", month: "short" })}</span><span>Máximo: ${maxDia} por día · total ${totalDias}</span><span>hoy</span></div>
    </div>

    <div class="grid2">
      <div><h2>Usuarios por provincia</h2><div class="panel">${provs.length ? provs.map(([p, n]) => `<div class="hb"><span title="${esc(p)}">${esc(p)}</span><span class="track"><i style="width:${n / maxProv * 100}%"></i></span><b>${n}</b></div>`).join("") : `<p class="sub">Todavía no hay datos.</p>`}</div></div>
      <div><h2>Desde dónde la usan</h2><div class="panel">${plats.map(([p, n]) => `<div class="hb"><span>${platNom[p]}</span><span class="track"><i style="width:${n / maxPlat * 100}%"></i></span><b>${n}</b></div>`).join("") || `<p class="sub">Todavía no hay datos.</p>`}
        <p class="nota">Se registra cuando cada persona abre la app con esta versión.</p></div></div>
    </div>

    <h2>Barrios</h2>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <input class="buscar" id="buscarBarrio" placeholder="Buscar barrio o provincia" value="${esc(filtroBarrio)}">
        <span class="sub">${barriosListos} barrio${barriosListos === 1 ? "" : "s"} con ${MIN_CASAS_COMERCIO}+ casas (listos para mostrar datos a comercios)</span>
      </div>
      <div class="tabla"><table>
        <thead><tr>${[["barrio", "Barrio", ""], ["provincia", "Provincia", ""], ["usuarios", "Usuarios", "n"], ["activos", "Activos 30 d", "n"], ["casas", "Casas", "n"], ["listo", "Comercios", ""]].map(([c, t, cl]) => `<th class="${cl}" data-orden="${c}">${t}${ordenBarrios.col === c ? (ordenBarrios.desc ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
        <tbody id="tbBarrios"></tbody>
      </table></div>
    </div>

    <div class="grid2">
      <div><h2>Los que más recomiendan</h2><div class="panel">${k.topRefs.length ? `<div class="tabla"><table><tbody>${k.topRefs.map((r, i) => `<tr><td>${i + 1}. ${esc(r.nombre)}</td><td class="n">${r.n} persona${r.n === 1 ? "" : "s"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="sub">Cuando alguien entre con un link de "Recomendá Despensa", aparece acá.</p>`}</div></div>
      <div><h2>Productos más cargados</h2><div class="panel">${datos.top.length ? `<div class="tabla"><table><tbody>${datos.top.map(p => `<tr><td>${esc(p.nombre)}</td><td>${esc(p.categoria || "")}</td><td class="n">${p.usos} casa${p.usos === 1 ? "" : "s"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="sub">Todavía no hay productos en el catálogo.</p>`}</div></div>
    </div>
    <p class="nota">Los datos personales (DNI, mail) no se muestran en este panel. Los números se calculan al abrirlo; tocá Actualizar para refrescar.</p>`;
  pintarBarrios(k);
  $("#buscarBarrio").oninput = e => { filtroBarrio = e.target.value; pintarBarrios(calcular()); };
  for (const th of document.querySelectorAll("[data-orden]")) th.onclick = () => {
    const c = th.dataset.orden;
    ordenBarrios = { col: c, desc: ordenBarrios.col === c ? !ordenBarrios.desc : !["barrio", "provincia"].includes(c) };
    pintar();
  };
}

function pintarBarrios(k) {
  const q = filtroBarrio.trim().toLowerCase();
  const filas = k.barrios.filter(b => !q || `${b.barrio} ${b.provincia}`.toLowerCase().includes(q)).map(b => ({ ...b, listo: b.casas >= MIN_CASAS_COMERCIO ? 1 : 0 }));
  const { col, desc } = ordenBarrios;
  filas.sort((a, b) => { const x = a[col] ?? "", y = b[col] ?? ""; const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "es"); return desc ? -r : r; });
  $("#tbBarrios").innerHTML = filas.length ? filas.map(b => `<tr><td>${esc(b.barrio)}</td><td>${esc(b.provincia)}</td><td class="n">${b.usuarios}</td><td class="n">${b.activos}</td><td class="n">${b.casas}</td>
    <td>${b.listo ? `<span class="pill">Listo</span>` : `<span class="pill no">Faltan ${MIN_CASAS_COMERCIO - b.casas}</span>`}</td></tr>`).join("")
    : `<tr><td colspan="6" class="sub">Sin resultados.</td></tr>`;
}

$("#btnCsv").onclick = () => {
  if (!datos) return;
  const k = calcular();
  const filas = [["Provincia", "Barrio", "Usuarios", "Activos 30 dias", "Casas"], ...k.barrios.map(b => [b.provincia, b.barrio, b.usuarios, b.activos, b.casas])];
  const csv = "﻿" + filas.map(f => f.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `despensa-barrios-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
</script>
</body>
</html>
