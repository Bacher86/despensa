name: Prueba IA ticket (temporal)
on:
  workflow_dispatch:
    inputs:
      img: { description: "jpg base64", required: true }
permissions: { contents: read }
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - env: { IMG: "${{ inputs.img }}" }
        run: |
          PROMPT='Es la foto de un ticket de supermercado de Argentina. Leé cada producto comprado.\n- Los precios usan punto para miles y coma para decimales (1.234,56).\n- La cantidad puede estar en un renglón aparte, arriba o abajo del producto ("2 x 1.390,00", "0,765 kg x 4.999,00").\n- Si hay un descuento, restáselo al producto.\n- No incluyas subtotal, total, IVA, impuestos ni medios de pago.\n- La alícuota de IVA entre paréntesis ("(21,00)", "(10,50)") no es un precio. El código de barras tampoco.\n- "desc" es el texto tal cual; "nombre" es cómo lo llamaría una persona en Argentina, sin marca, tamaño ni envase.\nRespondé solo este JSON: {"comercio":"Coto","total":12345.67,"productos":[{"desc":"...","nombre":"...","cantidad":1,"kg":false,"importe":1234.5}]}'
          jq -n --arg p "$(printf "$PROMPT")" --arg d "$IMG" '{contents:[{role:"user",parts:[{text:$p},{inlineData:{mimeType:"image/jpeg",data:$d}}]}],generationConfig:{responseMimeType:"application/json",temperature:0.2}}' > req.json
          for m in gemini-3.8-flash gemini-flash-lite-latest gemini-flash-latest gemini-3.8-flash; do echo "== $m"; curl -s -X POST "https://firebasevertexai.googleapis.com/v1beta/projects/casa-48f64/models/$m:generateContent" -H "Content-Type: application/json" -H "x-goog-api-key: AIzaSyDg0svGUiA37wOkrs31ROHMfx-OieBG6Xo" -H "X-Firebase-AppId: 1:839069249046:web:a76ce8e1b2c6e15b920f37" -d @req.json | jq -r '.candidates[0].content.parts[0].text // .error.message' ; done
