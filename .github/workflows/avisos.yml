name: Avisos con la app cerrada

# Cada 30 minutos revisa las casas y manda los avisos de Kai a los teléfonos
# (alguien agregó algo a la lista, mañana se termina, vence mañana, repaso del domingo).
# Necesita el secreto FIREBASE_SA: Settings → Secrets and variables → Actions → New repository secret.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar Firebase
        working-directory: scripts
        run: npm install --no-save --no-package-lock --silent firebase-admin@12.7.0
      - name: Mandar avisos
        working-directory: scripts
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node avisos.mjs
