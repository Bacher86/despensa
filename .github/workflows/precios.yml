name: Precios de supermercados

# Todos los días baja los precios oficiales (Precios Claros / SEPA) de Coto, Jumbo, Día y Vea
# y actualiza precios.json, que es lo que lee la app.
on:
  schedule:
    - cron: "30 22 * * *"   # 19:30 hora argentina
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Bajar y procesar precios
        run: python3 scripts/precios_sepa.py
      - name: Guardar precios.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Precios del día"
          git push || { echo "::error::GitHub no dejó guardar precios.json. Andá a Settings → Actions → General → Workflow permissions, elegí 'Read and write permissions', guardá y volvé a correrlo."; exit 1; }
