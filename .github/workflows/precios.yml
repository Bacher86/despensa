name: Precios de supermercados

# Todos los días baja los precios oficiales (Precios Claros / SEPA) de Coto, Jumbo, Día y Vea
# y actualiza precios.json, que es lo que lee la app.
on:
  schedule:
    - cron: "30 22 * * *"   # 19:30 hora argentina
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar y procesar precios
        run: python scripts/precios_sepa.py
      - name: Guardar precios.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          git diff --cached --quiet || git commit -m "Precios del día"
          git push
