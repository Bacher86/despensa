name: App de Android

# Arma la app de Android de Kai (APK para probar en el celu + AAB para subir a Google Play)
# y la publica en la sección Releases del repo ("android-ultima").
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency: { group: android, cancel-in-progress: true }

jobs:
  armar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults: { run: { working-directory: android-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Firebase (llave de firma, app de Android, google-services.json)
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          pip install --quiet google-auth requests
          python3 configurar.py
          cat firma.env >> "$GITHUB_ENV"
      - name: Proyecto de Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#f2f3ec' --splashBackgroundColor '#f2f3ec'
          KAI_VCODE=$((100 + ${{ github.run_number }})) KAI_VNAME="1.0.${{ github.run_number }}" python3 parchear.py
          cp google-services.json android/app/
          npx cap sync android
      - name: Compilar
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../salida
          cp app/build/outputs/apk/release/app-release.apk ../salida/Kai.apk
          cp app/build/outputs/bundle/release/app-release.aab ../salida/Kai.aab
      - name: Publicar en Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete android-ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create android-ultima salida/Kai.apk salida/Kai.aab --title "Kai para Android (versión 1.0.${{ github.run_number }})" \
            --notes "Kai.apk: para instalar y probar en el celular. Kai.aab: para subir a Google Play." --latest=false
